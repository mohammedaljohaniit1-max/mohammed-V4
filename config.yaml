# ══════════════════════════════════════════════════════════════════════════════
# MOHAMMED V12.1 ZERO-TOLERANCE — Configuration File
# Zero-Touch Autonomous Attack & Discovery Engine (FINAL MANDATE)
# 65+ phases · 50+ OSINT sources · 5-gate false-positive validation
# 3-tier AI cascade · 8-WAF bypass matrix · PoE ethical boundary · 8 state machines
# 5 Secret Weapons: API Hunter · Response Differential · Smart Fuzz · JS Deep · Subdomain Intel
# V12.1: +7 modern tools (chaos · alterx · cdncheck · uncover · cariddi · trufflehog · ppmap)
# Copy this file and fill in your API keys before running.
# ══════════════════════════════════════════════════════════════════════════════

# ── API Keys ──────────────────────────────────────────────────────────────────
# All keys are OPTIONAL. The V7 OSINT engine (Phase 02b) uses 25+ key-LESS
# certificate-transparency / passive-DNS / archive sources; keys below merely
# unlock the extra premium sources (VirusTotal, SecurityTrails, Chaos, …).
api_keys:
  github: ""           # GitHub PAT (code search):  https://github.com/settings/tokens
  shodan: ""           # Shodan API (dns/domain):   https://account.shodan.io
  virustotal: ""       # VirusTotal subdomains:      https://www.virustotal.com/gui/my-apikey
  alienvault: ""       # AlienVault OTX passive-dns: https://otx.alienvault.com/api
  securitytrails: ""   # SecurityTrails subdomains:  https://securitytrails.com/app/account/credentials
  chaos: ""            # Chaos (ProjectDiscovery):   https://chaos.projectdiscovery.io
  censys: ""           # Censys (id:secret base64):  https://search.censys.io/account/api
  haveibeenpwned: ""   # HIBP breach intel:          https://haveibeenpwned.com/API/Key

# ── V7 Exploit Phases (Section 3: phases 31-45) ──────────────────────────────
# The custom exploit engines run REAL attack logic (differential IDOR, SSTI
# arithmetic oracle, race-condition burst, business-logic tampering, API
# security, correlation). Every candidate MUST clear the 5-gate false-positive
# validator (Section 4) before it becomes a finding.
exploit:
  enabled: true
  # Per-phase URL budget — the highest-signal head of the deduplicated corpus.
  max_urls_per_phase: 120
  # Race-condition burst size (release-barrier concurrency).
  race_concurrency: 20
  # Route every crafted exploit request through Burp when selective_routing is
  # on, so an operator can review the full attack in the sitemap (Section 5).
  route_through_burp: true

# ── V7 5-Gate False-Positive Validation (Section 4) ──────────────────────────
# Gate 1 baseline diff (SPA catch-all) · Gate 2 private data · Gate 3
# exploitability · Gate 4 in-scope · Gate 5 reproducible. Known-FP patterns
# (AWSALB cookies, CloudFront error pages, wildcard-CORS on public pages) are
# rejected pre-gate.
validation:
  enabled: true
  baseline_comparison: true   # probe a random path and discard SPA catch-alls

# ── Ollama — Local AI 3-TIER COGNITIVE CASCADE (V11.0, FLAW #2 fix) ──────────
# V10.0 used a single weak gemma:2b model for everything. V11.0 replaces it with
# a 3-tier cascade that routes each cognitive task to the right-sized model:
#   • fast_triage   (llama3.2:3b)   — fast FP gate / semantic triage
#   • deep_analysis (qwen2.5:7b)    — deep payload mutation / BOLA reasoning
#   • reasoning     (deepseek-r1:7b)— chain-of-thought state-planning / IDOR rank
# Missing models are auto-pulled at startup when auto_pull is true. Every tier
# fails open to deterministic heuristics when Ollama is offline.
ollama:
  enabled: true
  endpoint: "http://127.0.0.1:11434"
  model: "llama3.2:3b"   # legacy single-model field — coerced to fast_triage
  temperature: 0.2
  timeout: 15            # seconds — legacy default; per-tier timeouts below win
  # ── V11.0 3-tier cascade ──────────────────────────────────────────────────
  fast_triage: "llama3.2:3b"      # Tier 1 — fast triage / false-positive gate
  deep_analysis: "qwen2.5:7b"     # Tier 2 — deep payload / BOLA analysis
  reasoning: "deepseek-r1:7b"     # Tier 3 — reasoning / state-planning
  auto_pull: true                 # auto `ollama pull` any missing tier model
  timeout_fast: 5                 # seconds — Tier 1 timeout (fast path)
  timeout_deep: 15                # seconds — Tier 2 timeout
  timeout_reasoning: 30           # seconds — Tier 3 timeout (deepseek-r1 thinks)

# ── AI confirmation policy (Zero-FP, FIX #7) ─────────────────────────────────
ai:
  # When true, an unconfirmed Critical finding is auto-downgraded to
  # "Unverified-Critical" Info if the one-time startup Ollama probe found the
  # model offline. Nothing is reported as AI-confirmed without a REAL verdict.
  require_confirmation_for_critical: true

# ── V11.0 Deep Multi-WAF Bypass Matrix (FLAW #3 fix) ─────────────────────────
# When enabled (or when --waf-bypass is passed on the CLI), the bypass engine
# applies per-vendor evasion for Cloudflare / Akamai / AWS WAFv2 / DataDome /
# PerimeterX / Arkose. Behavioral WAFs (DataDome/PerimeterX/Arkose) escalate to
# a real Go-Rod browser session. The per-host request rate is HARD-CAPPED to
# ≤10 req/s even with bypass on (Section 5, RULE 4 — responsible disclosure).
waf_bypass:
  enabled: false               # opt-in; --waf-bypass CLI flag also forces it on
  http2_multiplex: true        # Cloudflare — HTTP/2 multiplexing
  header_fragmentation: true   # Cloudflare — fragment headers across TCP packets
  double_url_encode: true      # AWS WAFv2 — %27 → %2527 double-encoding
  case_variation: true         # AWS WAFv2 — SeLeCt / uNiOn keyword case flips
  comment_injection: true      # general — /**/ inline-comment obfuscation
  behavioral_browser: true     # DataDome/PerimeterX/Arkose — Go-Rod CDP fallback
  max_rps_per_host: 10         # ethical ceiling — never exceeded (clamped ≤10)

# ── V11.0 Responsible-Disclosure BOUNDARY / PoE engine (FLAW #4 fix) ─────────
# "Knock, don't break in." Every exploit engine PROVES a vulnerability without
# weaponizing it: RCE=timing/DNS only, SQLi=error/timing only, SSRF=DNS callback
# only, PathTraversal=/etc/hostname only, XSS=alert(document.domain) only. The
# engine returns CONFIRMED_SAFE_PoC / CONFIRMED_NEEDS_MANUAL_REVIEW / NOT_VULNERABLE
# and NEVER executes a destructive payload.
boundary:
  mode: "prove_only"           # prove_only — the only supported (safe) mode
  oob_domain: ""               # optional interactsh/OOB domain for SSRF callbacks
  timing_seconds: 5            # injected delay for time-based RCE/SQLi proofs

# ── Zero-FP Filtering (FIX #1/#2) ────────────────────────────────────────────
filter:
  # Strip Cloudflare challenge tokens (__cf_chl_rt_tk, cf_clearance, …) and
  # analytics params (utm_*, fbclid, gclid, …) before any injection tool sees a
  # URL; CF-challenge URLs are NEVER sent to sqlmap/dalfox/ghauri (FP #1).
  strip_cloudflare_params: true
  # Enforce scope on JavaScript secret scanning so squarespace/cloudfront CDN
  # bundles are never mined for "secrets" (FP #2).
  enforce_scope_on_js: true

# ── Proxy & WAF Evasion ──────────────────────────────────────────────────────
proxy:
  header_spoofing: true
  user_agent_rotation: true
  adaptive_throttling: true
  # FIX #5 — Two-tier Burp routing. When true, high-volume discovery/fuzzing/
  # crawling/archive-mining phases (Tier 1) run DIRECT and never flood Burp;
  # only confirmed-evidence phases (Tier 2) are proxied through Burp.
  selective_routing: true

# ── Context Chain (Auto token propagation) ────────────────────────────────────
context_chain:
  enabled: true
  auto_extract_js: true
  auto_inject_headers: true

# ── Parameter Profiler (Intelligent parameter classification) ─────────────────
param_profiler:
  enabled: true
  min_priority: 1

# ── V12.0 OMEGA — 5 Secret Weapons (Phases 61-65) ────────────────────────────
# Five pure-Go, self-contained exploit algorithms — no external CLI, no network
# tools beyond the proxy-aware exploit.Client. Every candidate they surface still
# clears the same 5-gate false-positive validator (Section 4) and honours the
# PoE ethical boundary — they PROVE, never weaponize.
#
#   SW#1 API Hunter        — classify endpoints (AUTH/DATA/MONEY/ADMIN/OAUTH) and
#                            run the right attack sequence per class.
#   SW#2 Response Diff     — cross-context structural JSON diff for BOLA/IDOR,
#                            ignoring timestamps / session IDs / CSRF tokens.
#   SW#3 Smart Fuzz        — WAF-adaptive mutation (baseline→probe→adapt), with an
#                            optional Ollama-brain escalation; stops at first PoE.
#   SW#4 JS Deep           — mine JS for endpoints / admin / secrets / WS / GraphQL
#                            / S3 / source-maps; Shannon-entropy gated (reject <3.5).
#   SW#5 Subdomain Intel   — functional grouping (production / staging-dev /
#                            internal / infra), staging-vs-prod diff, Wayback history.
#
# Each weapon defaults ON. Each per-scan budget caps a huge corpus so no single
# weapon can turn into an hours-long phase.
secret_weapons:
  api_hunter: true               # SW#1 — endpoint classification + per-class attacks
  differential: true             # SW#2 — cross-context structural diff (BOLA/IDOR)
  smart_fuzz: true               # SW#3 — WAF-adaptive mutation fuzzer
  js_deep: true                  # SW#4 — deep JavaScript mining
  subdomain_intel: true          # SW#5 — functional subdomain grouping + Wayback
  api_hunter_budget: 400         # max endpoints classified/attacked (default 400)
  differential_budget: 250       # max URLs compared cross-context (default 250)
  smart_fuzz_budget: 150         # max parameterized URLs fuzzed (default 150)
  js_deep_budget: 200            # max JS files mined (default 200)
  js_entropy_floor: 3.5          # min Shannon entropy for a secret candidate (3.5)
  wayback_history: true          # SW#5 — Wayback historical takeover-candidate diff
